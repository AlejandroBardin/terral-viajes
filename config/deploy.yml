# Name of your application. Used to uniquely configure containers.
service: terral-viajes

# Name of the container image.
image: alebardin/terral-viajes

# Deploy to these servers.
servers:
  web:
    hosts:
      - 140.238.178.169

proxy:
  ssl: true
  host: terral-viajes.bibilioteca-dev.com.ar
  healthcheck:
    interval: 5

# Credentials for your image host - USA VARIABLES DE ENTORNO
registry:
  username: alebardin
  password:
    - KAMAL_REGISTRY_PASSWORD

# Builder configuration
builder:
  arch: aarch64

# Inject ENV variables into containers
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
  clear:
    DB_HOST: 140.238.178.169
    ActionMailer_Host: "terral-viajes.bibilioteca-dev.com.ar"
    # Database Config (Internal Network)
    DB_HOST: terral-viajes-db
    DB_PORT: 5432
    POSTGRES_USER: terral_viajes
    POSTGRES_DB: terral_viajes_production
    REDIS_URL: redis://terral-viajes-redis:6379/1
    RAILS_LOG_LEVEL: info
    RAILS_SERVE_STATIC_FILES: true
    WEB_CONCURRENCY: 0
    RAILS_MAX_THREADS: 3

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Accessories: Postgres and Redis
accessories:
  db:
    image: postgres:15
    host: 140.238.178.169
    port: 5433:5432
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_USER: terral_viajes
        POSTGRES_DB: terral_viajes_production
    files:
      - config/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data/db:/var/lib/postgresql/data

  redis:
    image: redis:7.0
    host: 140.238.178.169
    port: 6380:6379
    directories:
      - data/redis:/data

boot:
  limit: 120
  wait: 60

ssh:
  user: ubuntu
  # La key se lee desde Rails.application.credentials.ssh.private_key
  # Para que Kamal la use, necesitas crear un archivo temporal o usar ssh-agent
  # Por ahora, mantén el archivo pero lo moverás a ~/.ssh/
  keys: ["~/.ssh/terral-viajes-deploy"]